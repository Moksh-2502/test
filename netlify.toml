[build]
  command = "corepack pnpm install --frozen-lockfile=false --prod=false && corepack pnpm build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  included_files = ["node_modules/.prisma/client/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
